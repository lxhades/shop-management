<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ECommerce Mini</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<header><strong>ECommerce Mini</strong>
    <nav><a href="/products">Sản phẩm</a><a href="/categories">Danh mục</a></nav>
</header>
<main><p class="notice" th:if="${message}" th:text="${message}"></p>
    <h1 th:text="${id == null ? 'Thêm sản phẩm' : 'Sửa sản phẩm'}"></h1>
    <p th:if="${#lists.isEmpty(categories)}">Cần <a href="/categories/new">thêm danh mục</a> trước.</p>
    <form class="card" th:action="@{/products/save}" th:object="${product}" method="post"><input type="hidden" name="id"
                                                                                                 th:if="${id != null}"
                                                                                                 th:value="${id}"><label>Tên
        sản phẩm<input th:field="*{name}" required maxlength="255"></label>
        <p class="error" th:errors="*{name}"></p><label>Giá (VND)<input type="number" th:field="*{price}" min="0.01"
                                                                        step="0.01" required></label>
        <p class="error" th:errors="*{price}"></p><label>Tồn kho<input type="number" th:field="*{stock}" min="0"
                                                                       required></label>
        <p class="error" th:errors="*{stock}"></p><label>Danh mục<select th:field="*{categoryId}" required>
            <option value="">Chọn danh mục</option>
            <option th:each="c:${categories}" th:value="${c.id}" th:text="${c.name}"></option>
        </select></label>
        <p class="error" th:errors="*{categoryId}"></p>
        <button th:disabled="${#lists.isEmpty(categories)}">Lưu sản phẩm</button>
        <a href="/products">Quay lại</a></form>
</main>
<footer>TX1 · Spring Boot · JPA / Hibernate · MySQL</footer>
</body>
</html>

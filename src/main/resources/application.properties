spring.application.name=shop-management-app
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/shop_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:rootpassword}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false
server.error.include-message=always
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=shop-management-app
management.metrics.distribution.percentiles-histogram.http.server.requests=true

services:
  mysql-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: shop_management
      MYSQL_USER: shop
      MYSQL_PASSWORD: shoppassword
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -ushop -pshoppassword -e 'SELECT 1' shop_management"]
      interval: 5s
      timeout: 5s
      retries: 30
  shop-app:
    build: .
    image: shop-management-app:local
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/shop_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: shop
      SPRING_DATASOURCE_PASSWORD: shoppassword
    depends_on:
      mysql-db:
        condition: service_healthy
volumes:
  mysql_data:

apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: shop-app
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames: [default]
  selector:
    matchLabels:
      app: shop-app
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
